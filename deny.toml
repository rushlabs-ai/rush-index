# cargo-deny policy: known vulnerabilities, licences, duplicate or untrusted sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # paste: "unmaintained" notice, not a vulnerability. A compile-time macro (no runtime code)
  # pulled in by Hugging Face tokenizers. Reviewed 2026-11-08; revisit when tokenizers drops it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro via tokenizers; no known vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "zlib-acknowledgement", "Unicode-3.0", "Unlicense", "0BSD", "BSL-1.0", "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
